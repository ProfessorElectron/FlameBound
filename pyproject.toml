[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flamebound-research"
version = "0.1.0"
description = "Evidence-tracked analysis of NASA solid-fuel combustion experiments"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
all = [
    "fastapi>=0.110",
    "matplotlib>=3.8",
    "httpx>=0.27",
    "numpy>=1.26",
    "pypdf>=5.0",
    "pandas>=2.1",
    "plotly>=5.18",
    "pydantic>=2.6",
    "pytest>=8.0",
    "scipy>=1.12",
    "uvicorn[standard]>=0.27",
]

[tool.setuptools.packages.find]
include = ["modelling*", "backend*", "ai*"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
python_files = ["test_*.py"]
