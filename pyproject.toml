[build-system]
requires = ["setuptools==79.0.1", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "flamebound-research"
version = "0.1.0"
description = "Evidence-tracked analysis of NASA solid-fuel combustion experiments"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pypdf>=4.2",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
all = [
    "openpyxl>=3.1",
    "pytest>=8.0",
]
audit = ["openpyxl>=3.1"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["modelling*", "backend*", "ai*"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
python_files = ["test_*.py"]
